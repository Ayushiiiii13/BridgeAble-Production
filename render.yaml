services:
  # BridgeAble AI Module — Docker service (required for libGLESv2 / MediaPipe on Render)
  - type: web
    name: bridgeable-ai
    runtime: docker
    rootDir: ai-module
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MODEL_PATH
        value: ./models/gesture_recognizer.task
      - key: CONFIDENCE_THRESHOLD
        value: "0.70"
    autoDeploy: true
